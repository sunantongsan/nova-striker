name: Native Android PR validation
on:
  # Paused to save GitHub Actions quota; run by hand from the Actions tab when needed.
  # Game patches are built and published by Vercel on every push.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify incremental patch download and recovery
        run: |
          node tests/patch-chunks.cjs /tmp/nova-delta-fixture
          mkdir -p /tmp/nova-delta-classes
          javac -d /tmp/nova-delta-classes app/src/main/java/com/sunantongsan/novastriker/PatchFiles.java app/src/main/java/com/sunantongsan/novastriker/PatchChunks.java tests/PatchFilesTest.java tests/PatchChunksTest.java
          java -cp /tmp/nova-delta-classes com.sunantongsan.novastriker.PatchFilesTest
          java -cp /tmp/nova-delta-classes com.sunantongsan.novastriker.PatchChunksTest /tmp/nova-delta-fixture
      - run: node tests/native-packaging.cjs
      - run: gradle :app:compileDebugJavaWithJavac --no-daemon
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/banner39-browser.cjs

