name: Play Games validation
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/play-games-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/welcome217.cjs && node tests/platform-isolation.cjs
      - run: gradle :app:verifySdkVersions :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-play-games-integration-test
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
