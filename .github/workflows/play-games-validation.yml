name: Play Games validation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/java/**'
      - '.github/workflows/play-games-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/welcome217.cjs && node tests/platform-isolation.cjs
      - name: Verify Play Games callback lifecycle
        run: |
          mkdir -p /tmp/nova-pgs-tests
          javac -d /tmp/nova-pgs-tests app/src/main/java/com/sunantongsan/novastriker/PlayGamesRequestGate.java tests/java/com/sunantongsan/novastriker/PlayGamesRequestGateTest.java
          java -cp /tmp/nova-pgs-tests com.sunantongsan.novastriker.PlayGamesRequestGateTest
      - run: gradle :app:verifySdkVersions :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-play-games-integration-test
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
