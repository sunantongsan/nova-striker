name: Mobile UI regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/resources375.mjs
      - run: node tests/mobile364-browser.cjs
      - run: node tests/visual373-browser.cjs
        if: success() || failure()
      - run: node tests/combat379-browser.cjs
        if: success() || failure()
      - run: node tests/audio380-browser.cjs
        if: success() || failure()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        if: always()
        with:
          name: mobile-ui-screenshots
          path: test-artifacts/


      - run: node features/titan342/build.cjs && node scripts/patch.cjs
        if: success()
      - run: node tests/repair381-browser.cjs
        if: success()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        if: always()
        with:
          name: repair381-proof
          path: test-artifacts/repair381*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        if: success()
        with:
          name: nova-patch-151
          path: patch-dist/
          retention-days: 7
