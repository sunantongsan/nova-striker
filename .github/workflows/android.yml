name: Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build test APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish test APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "android-${{ github.run_number }}" app/build/outputs/apk/debug/*.apk --target "$GITHUB_SHA" --prerelease --title "Nova Striker Android build ${{ github.run_number }}" --notes 'Test APK. Release AAB requires the existing upload key.'
      - name: Build signed Play bundle when signing is configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::notice::Release signing is not configured. Test APK only; no uploadable AAB yet.'
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nova-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Striker-Play-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
