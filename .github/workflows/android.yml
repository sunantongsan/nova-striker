name: Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test RTS gameplay
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node tests/native-packaging.cjs
      - name: Verify compact dialogs in mobile browsers
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
          node tests/layout306-browser.cjs
      - name: Save mobile layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-mobile-layout
          path: qa306/*.png
          retention-days: 7
      - name: Test patch integrity on JVM
        run: |
          mkdir -p /tmp/nova-patch-tests
          javac -d /tmp/nova-patch-tests app/src/main/java/com/sunantongsan/novastriker/PatchFiles.java tests/PatchFilesTest.java
          java -cp /tmp/nova-patch-tests com.sunantongsan.novastriker.PatchFilesTest
      - name: Build test APK
        run: gradle :app:verifySdkVersions :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 cold-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-launch-smoke.sh
      - name: Publish test APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "android-${{ github.run_number }}" app/build/outputs/apk/debug/*.apk --target "$GITHUB_SHA" --prerelease --title "Nova Striker Android build ${{ github.run_number }}" --notes 'Test APK. Production package com.sunantongsan.novastriker. Signed releases use the new Nova upload key.'
      - name: Build signed Play bundle when signing is configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::notice::Building unsigned AAB for local signing with the existing upload key.'
            gradle :app:bundleRelease --no-daemon
            mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-unsigned.aab
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nova-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle :app:bundleRelease --no-daemon
      - name: Verify packaged content before publishing
        run: |
          for bundle in app/build/outputs/bundle/release/*.aab; do
            python3 scripts/verify-bundle.py "$bundle"
          done
      - name: Attach unsigned bundle for local signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/bundle/release/app-unsigned.aab ]; then
            gh release upload "android-${{ github.run_number }}" app/build/outputs/bundle/release/app-unsigned.aab
          fi
      - name: Attach signed AAB when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            gh release upload "android-${{ github.run_number }}" app/build/outputs/bundle/release/app-release.aab
          fi

      - name: Save Play bundle for signing
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nova-play-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7



