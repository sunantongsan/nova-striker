plugins { id 'com.android.application' }
android {
    namespace 'com.sunantongsan.novastriker'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.sunantongsan.novastriker'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets { main.assets.srcDirs = [layout.buildDirectory.dir('generated/gameAssets')] }
}
tasks.register('copyGame', Copy) {
    from(rootProject.file('index.html'))
    from(rootProject.file('game.js'))
    from(rootProject.file('assets')) { include '*.webp'; into 'assets' }
    into(layout.buildDirectory.dir('generated/gameAssets'))
}
tasks.named('preBuild').configure { dependsOn 'copyGame' }
dependencies {
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0'; implementation 'com.google.android.gms:play-services-ads:25.5.0'; implementation 'com.google.android.ump:user-messaging-platform:4.0.0' }


tasks.register('verifySdkVersions') {
    doLast {
        def selected = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { it.moduleVersion.id }
        ['androidx.fragment:fragment':'1.8.9', 'androidx.activity:activity':'1.10.1'].each { coordinate, minimum ->
            def found = selected.find { "${it.group}:${it.name}" == coordinate }
            if (found == null || found.version.tokenize('.').take(2).collect { it as int }.with { it[0] < 1 || (it[0] == 1 && it[1] < minimum.tokenize('.')[1].toInteger()) }) {
                throw new GradleException("Unexpected SDK version: ${coordinate} ${found}")
            }
            println("Verified SDK: ${found}")
        }
    }
}

