 if(u.aim==='rifle'){u.A.r.sh.rotation.z=1.1;u.A.r.el.rotation.z=0.5;u.A.l.sh.rotation.z=1.35;u.A.l.el.rotation.z=0.35;u.A.l.sh.rotation.x=0.25;u.A.r.sh.rotation.x=-0.25;u.rifle.position.x=0.18-rec*0.08;return;}
 u.gunArm.sh.rotation.z=1.25-rec*0.25;u.gunArm.el.rotation.z=0.3;
 if(u.shieldArm){u.shieldArm.sh.rotation.z=0.75;u.shieldArm.el.rotation.z=0.75;u.shieldArm.sh.rotation.x=0.15;}
 else{u.A.l.sh.rotation.z=0.15;u.A.l.el.rotation.z=0.4;}}
window.pose=(name,dirA,anim,f)=>{
 setup(name);const u=cur;reset(u);flash.visible=false;u.root.rotation.y=-dirA;const h=u.heavy;
 if(anim==='walk'){const p=f/8*Math.PI*2,s=Math.sin(p),c=Math.cos(p);
  u.L.l.hip.rotation.z=s*0.55*h+0.05;u.L.r.hip.rotation.z=-s*0.55*h+0.05;

  u.body.position.y=-Math.abs(s)*0.05*h;u.body.rotation.x=s*0.05*(2-h);u.torso.rotation.z=-0.08;
  armsReady(u,0);if(u.aim==='rifle'){u.torso.rotation.y=s*0.06;}else{u.A.l.sh.rotation.z+= -s*0.35*h;}
 }else if(anim==='attack'){const rec=[0,1,0.5,0.15][f];armsReady(u,rec);u.torso.rotation.z=-0.05+rec*0.06;u.L.l.hip.rotation.z=0.25;u.L.r.hip.rotation.z=-0.15;u.L.l.knee.rotation.z=-0.25;
  if(f===1){flash.visible=true;}
 }else if(anim==='death'){const k=f/4;armsReady(u,0);u.root.rotation.z=k*1.5;u.root.position.x=-k*0.25;u.root.position.y=Math.sin(k*Math.PI)*0.12;
  u.L.l.knee.rotation.z=-k*0.6;u.L.r.knee.rotation.z=-k*0.4;u.A.l.sh.rotation.z=0.3+k*1.4;u.head.rotation.z=k*0.4;
 }else{const p=f/4*Math.PI*2;armsReady(u,0);u.body.position.y=Math.sin(p)*0.012;u.torso.rotation.z=Math.sin(p)*0.02;u.head.rotation.y=Math.sin(p)*0.08;}
 u.root.updateMatrixWorld(true);const v=new T.Vector3();u.muzzle.getWorldPosition(v);
 if(flash.visible){flash.position.copy(u.root.worldToLocal(v.clone()));}
 R.render(S,cam);const pv=v.clone().project(cam),o=new T.Vector3(0,0,0).project(cam);
 return {img:canvas.toDataURL('image/png'),mx:(pv.x+1)/2*canvas.width,my:(1-pv.y)/2*canvas.height,ox:(o.x+1)/2*canvas.width,oy:(1-o.y)/2*canvas.height};
};
