<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="368" height="368"></canvas>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
// 401: base guard robot (owner's model) auto-rigged and posed for pre-rendered sprites.
// Faces local +x after the wrapper rotation; yaw = -gridAngle (same convention as units3d.html).
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.getElementById('c');
const R=new T.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setClearColor(0,0);R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
const S=new T.Scene();
S.add(new T.HemisphereLight(0xfff6e8,0x6a86b8,2.1));
const sun=new T.DirectionalLight(0xfff0d6,3.4);sun.position.set(-3,10,7);S.add(sun);
const rim=new T.DirectionalLight(0x9fe3ff,1.8);rim.position.set(7,3,-5);S.add(rim);
// Same projection direction as the troop renders; frame sized for a ~1 unit tall robot incl. flight.
const cam=new T.OrthographicCamera(-0.64,0.64,0.74,-0.54,0.1,100);cam.position.set(10,11.17,10);cam.lookAt(0,0.45,0);cam.position.add(new T.Vector3(0,0.45,0).sub(new T.Vector3(0,0,0)).multiplyScalar(0));
const params=new URLSearchParams(location.search);
const gltf=await new GLTFLoader().loadAsync(params.get('model'));
let src=null;gltf.scene.traverse(o=>{if(o.isMesh&&!src)src=o;});
src.updateWorldMatrix(true,false);
const geo=src.geometry.clone();geo.applyMatrix4(src.matrixWorld);
const cx=0.02;
// Skeleton
const B={};function bone(name,parent,x,y,z){const b=new T.Bone();b.name=name;B[name]=b;b.userData.abs=new T.Vector3(x,y,z);if(parent){parent.add(b);b.position.set(x-parent.userData.abs.x,y-parent.userData.abs.y,z-parent.userData.abs.z);}else b.position.set(x,y,z);return b;}
const root=bone('root',null,cx,0,0);
const pelvis=bone('pelvis',root,cx,0.42,0);
const body=bone('body',pelvis,cx,0.58,0);
for(const s of [1,-1]){const n=s>0?'L':'R';
 const sh=bone('sh'+n,body,cx+s*0.27,0.64,0);bone('el'+n,sh,cx+s*0.33,0.47,0.0);
 const hip=bone('hip'+n,pelvis,cx+s*0.10,0.40,0);const kn=bone('kn'+n,hip,cx+s*0.11,0.24,0.0);bone('an'+n,kn,cx+s*0.11,0.10,0.02);}
const order=Object.keys(B),idx={};order.forEach((k,i)=>idx[k]=i);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const P=geo.attributes.position,n=P.count,si=new Uint16Array(n*4),sw=new Float32Array(n*4);
for(let i=0;i<n;i++){const x=P.getX(i),y=P.getY(i),dx=x-cx,ax=Math.abs(dx),side=dx>=0?'L':'R';const w={};
 if(y<0.135||(y<0.41&&ax<0.20)){const t=ss(0.20,0.28,y),p=ss(0.37,0.43,y);w['kn'+side]=(1-t)*(1-p);w['hip'+side]=t*(1-p);w.pelvis=p;}
 else if(ax>0.20&&y<0.67){const u=ss(0.43,0.52,y),b=ss(0.60,0.67,y);w['el'+side]=(1-u)*(1-b);w['sh'+side]=u*(1-b);w.body=b;}
 else{const k=ss(0.50,0.60,y);w.body=k;w.pelvis=1-k;}
 const e=Object.entries(w).filter(a=>a[1]>0.001).sort((a,b)=>b[1]-a[1]).slice(0,4);let tot=e.reduce((s,a)=>s+a[1],0)||1;
 e.forEach((a,j)=>{si[i*4+j]=idx[a[0]];sw[i*4+j]=a[1]/tot;});if(!e.length){si[i*4]=idx.pelvis;sw[i*4]=1;}}
// Generated meshes fuse fists to thighs and the two legs at the crotch; cut faces that bridge separate limbs.
{const grp=k=>/^(sh|el)L/.test(k)?'aL':/^(sh|el)R/.test(k)?'aR':/^(hip|kn|an)L/.test(k)?'lL':/^(hip|kn|an)R/.test(k)?'lR':'c';
 const vg=new Array(n);for(let i=0;i<n;i++)vg[i]=grp(order[si[i*4]]);
 const I=geo.index?geo.index.array:Array.from({length:n},(_,i)=>i),keep=[];let cut=0;
 for(let t=0;t<I.length;t+=3){const g=new Set([vg[I[t]],vg[I[t+1]],vg[I[t+2]]]);g.delete('c');if(g.size>1){cut++;continue;}keep.push(I[t],I[t+1],I[t+2]);}
 geo.setIndex(keep);window.cut=cut;}
geo.setAttribute('skinIndex',new T.Uint16BufferAttribute(si,4));geo.setAttribute('skinWeight',new T.Float32BufferAttribute(sw,4));
const tl=new T.TextureLoader();const tex=f=>{const t=tl.load(f);t.flipY=false;return t;};
const baseMap=tex(params.get('map'));baseMap.colorSpace=T.SRGBColorSpace;
const mat=new T.MeshStandardMaterial({map:baseMap,normalMap:tex(params.get('normal')),metalnessMap:tex(params.get('mr')),roughnessMap:tex(params.get('mr')),metalness:0.55,roughness:0.75});
const mesh=new T.SkinnedMesh(geo,mat);
const wrap=new T.Group();wrap.rotation.y=Math.PI/2;S.add(wrap);
const holder=new T.Group();wrap.add(holder);
holder.add(root);holder.add(mesh);
// bind pose: bones at rest; world inverse computed by Skeleton
holder.updateMatrixWorld(true);
const skel=new T.Skeleton(order.map(k=>B[k]));mesh.bind(skel);
// thruster flames (fly) and eye flash (attack)
const FL=new T.MeshBasicMaterial({color:0x7ff0ff,transparent:true,opacity:0.85}),FL2=new T.MeshBasicMaterial({color:0xe8ffff});
const flames=[];for(const s of ['L','R']){const g=new T.Group();const c1=new T.Mesh(new T.ConeGeometry(0.05,0.26,16),FL);c1.rotation.x=Math.PI;c1.position.y=-0.13;const c2=new T.Mesh(new T.ConeGeometry(0.025,0.16,12),FL2);c2.rotation.x=Math.PI;c2.position.y=-0.08;g.add(c1,c2);g.userData.side=s;holder.add(g);flames.push(g);}
const eye=new T.Mesh(new T.SphereGeometry(0.075,20,14),new T.MeshBasicMaterial({color:0xfff4a8,transparent:true,opacity:0.95}));eye.position.set(0,0.778-0.58,0.17);B.body.add(eye);
const beam=new T.Mesh(new T.SphereGeometry(0.045,20,14),new T.MeshBasicMaterial({color:0xffffff}));beam.position.set(0,0.778-0.58,0.2);B.body.add(beam);const halo=new T.Mesh(new T.SphereGeometry(0.075,20,14),new T.MeshBasicMaterial({color:0x7ff3ff,transparent:true,opacity:0.5}));beam.add(halo);
const rest={};order.forEach(k=>rest[k]={p:B[k].position.clone(),r:B[k].rotation.clone()});
function reset(){order.forEach(k=>{B[k].position.copy(rest[k].p);B[k].rotation.copy(rest[k].r);});holder.position.set(0,0,0);holder.rotation.set(0,0,0);flames.forEach(f=>f.visible=false);eye.visible=false;beam.visible=false;}
// model axes (before wrap): +z forward, +x robot's left side, +y up. Rotation about x pitches forward (+ = toes/head forward).
function legs(sL,kL,sR,kR){B.hipL.rotation.x=-sL;B.knL.rotation.x=kL;B.hipR.rotation.x=-sR;B.knR.rotation.x=kR;}
function arms(aL,eL,aR,eR,spread){B.shL.rotation.x=-aL;B.elL.rotation.x=-eL;B.shR.rotation.x=-aR;B.elR.rotation.x=-eR;B.shL.rotation.z=spread||0;B.shR.rotation.z=-(spread||0);}
window.pose=(dirA,anim,f)=>{
 reset();window.__ground=(anim==='idle'||anim==='walk'||anim==='attack');wrap.rotation.y=Math.PI/2-dirA;
 const TAU=Math.PI*2;
 if(anim==='idle'){const p=f/4*TAU,s=Math.sin(p);B.pelvis.position.y=rest.pelvis.p.y-0.008*(1-Math.cos(p));B.body.rotation.x=0.03*s;B.body.rotation.y=0.06*Math.sin(p);arms(0.04*s,0.08,-0.04*s,0.08,0.04);legs(0,0.02,0,0.02);}
 else if(anim==='walk'){const p=f/6*TAU,s=Math.sin(p),c=Math.cos(p);
  legs(0.55*s,Math.max(0,-c)*0.9,-0.55*s,Math.max(0,c)*0.9);
  B.pelvis.position.y=rest.pelvis.p.y-0.035*Math.abs(Math.cos(p))+0.01;B.pelvis.rotation.z=0.06*s;B.body.rotation.z=-0.08*s;B.body.rotation.x=0.10;B.body.rotation.y=0.12*s;
  arms(-0.5*s,0.25+0.2*Math.max(0,s),0.5*s,0.25+0.2*Math.max(0,-s),0.08);}
 else if(anim==='jump'){const J=[
  {py:0,b:0.28,l:[0.55,1.05,0.5,1.0],a:[-0.35,0.35,-0.35,0.35,0.2]},
  {py:0.02,b:-0.12,l:[-0.2,0.05,-0.12,0.08],a:[0.9,0.2,0.9,0.2,0.35]},
  {py:0,b:0.0,l:[0.45,0.7,0.25,0.5],a:[0.6,0.4,0.6,0.4,0.6]},
  {py:0,b:0.12,l:[0.95,1.45,0.85,1.35],a:[0.25,0.6,0.25,0.6,0.85]},
  {py:0,b:-0.08,l:[0.05,0.15,-0.12,0.1],a:[0.95,0.1,0.95,0.1,0.7]},
  {py:0,b:0.32,l:[0.65,1.25,0.6,1.2],a:[0.35,0.3,0.35,0.3,0.25]}][f];
  B.body.rotation.x=J.b;B.pelvis.rotation.x=J.b*0.4;legs(...J.l);arms(...J.a);holder.position.y=J.py;window.__ground=(f===0||f===5);}
 else if(anim==='fly'){const p=f/4*TAU,s=Math.sin(p);holder.position.y=0.03*s;B.body.rotation.x=0.22;B.pelvis.rotation.x=0.18;
  legs(-0.25+0.08*s,0.55-0.1*s,-0.15-0.08*s,0.45+0.1*s);arms(-0.35,0.35,-0.35,0.35,0.35+0.05*s);flames.forEach((g,i)=>{g.visible=true;g.scale.set(1,0.85+0.3*Math.abs(Math.sin(p+i)),1);});}
 else if(anim==='attack'){const k=[0.2,1,0.6,0.25][f];B.body.rotation.x=-0.12+0.32*k;B.pelvis.position.y=rest.pelvis.p.y-0.02*k;legs(0.25,0.3,-0.2,0.15);arms(-0.6+0.4*k,0.5,-0.6+0.4*k,0.5,0.25);
  eye.visible=f>=1;beam.visible=f===1||f===2;beam.scale.setScalar(f===1?1.3:0.9);}
 else if(anim==='death'){const k=f/4;holder.rotation.x=-k*1.05;holder.position.z=-k*0.05;holder.position.y=Math.sin(k*Math.PI)*0.06-k*0.05;legs(-k*0.4,k*0.8,-k*0.2,k*0.6);arms(k*0.5,k*0.3,k*0.35,k*0.4,0.25*k);B.body.rotation.z=0.25*k;}
 holder.updateMatrixWorld(true);wrap.updateMatrixWorld(true);
 if(window.__ground){const a=new T.Vector3(),b=new T.Vector3();B.anL.getWorldPosition(a);B.anR.getWorldPosition(b);holder.worldToLocal(a);holder.worldToLocal(b);holder.position.y+=0.10-Math.min(a.y,b.y);holder.updateMatrixWorld(true);}
 flames.forEach(g=>{if(!g.visible)return;const v=new T.Vector3();B['an'+g.userData.side].getWorldPosition(v);holder.worldToLocal(v);g.position.copy(v);g.position.y-=0.07;g.rotation.set(0,0,0);});holder.updateMatrixWorld(true);
 R.render(S,cam);
 const o=new T.Vector3(0,0,0).project(cam);const ev=new T.Vector3();eye.getWorldPosition(ev);const e=ev.project(cam);
 return {img:canvas.toDataURL('image/png'),ox:(o.x+1)/2*canvas.width,oy:(1-o.y)/2*canvas.height,mx:(e.x+1)/2*canvas.width,my:(1-e.y)/2*canvas.height};
};
window.debug=()=>{const C=[0xff0000,0x00ff00,0x0000ff,0xffff00,0xff00ff,0x00ffff,0xffffff,0x000000,0xff8800,0x8800ff,0x0088ff,0x88ff00,0x884400,0x448800];const col=new Float32Array(n*3);for(let i=0;i<n;i++){const c=new T.Color(C[si[i*4]%14]);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}geo.setAttribute('color',new T.BufferAttribute(col,3));mesh.material=new T.MeshBasicMaterial({vertexColors:true});return order;};
window.longTris=()=>{const v=new T.Vector3(),I=geo.index.array,pos=[];for(let i=0;i<n;i++){v.fromBufferAttribute(P,i);mesh.applyBoneTransform(i,v);pos.push(v.clone());}
 const out=[];for(let t=0;t<I.length;t+=3){const a=I[t],b=I[t+1],c=I[t+2];const L=Math.max(pos[a].distanceTo(pos[b]),pos[b].distanceTo(pos[c]),pos[a].distanceTo(pos[c]));const L0=Math.max(...[[a,b],[b,c],[a,c]].map(([x,y])=>Math.hypot(P.getX(x)-P.getX(y),P.getY(x)-P.getY(y),P.getZ(x)-P.getZ(y))));if(L>0.08)out.push([L.toFixed(3),L0.toFixed(3),[a,b,c].map(i=>order[si[i*4]]+':'+sw[i*4].toFixed(2)+'@'+P.getX(i).toFixed(2)+','+P.getY(i).toFixed(2)+','+P.getZ(i).toFixed(2)).join(' ')]);}
 out.sort((x,y)=>y[0]-x[0]);return [out.length,out.slice(0,12)];};
window.setMap=(f)=>new Promise(r=>{tl.load(f,t=>{t.flipY=false;t.colorSpace=T.SRGBColorSpace;mat.map=t;mat.needsUpdate=true;r();});});
await new Promise(r=>setTimeout(r,1500));
window.ready=true;
</script></body></html>
