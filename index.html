function groundArt(){rect(bg,0,0,W,H,'#919667');for(var n=0;n<145;n++){var x=(n*73+19)%400,y=(n*137+33)%470;rect(bg,x,y,3+n%6,2,'#7e885d');}line(bg,path,'#c4bb89',49);line(bg,path,'#666b56',37);line(bg,path,'#73755e',29);bg.setLineDash([6,15]);line(bg,path,'#c3bd91',1);bg.setLineDash([]);for(var n=0;n<22;n++){var x=(n*97+160)%390,y=(n*61+115)%450;if(onRoad(x,y,38))continue;circle(bg,x+3,y+4,9,'#747a50');circle(bg,x,y,8,'#516d42');circle(bg,x-3,y-3,5,'#6e874e');}for(var n=0;n<pads.length;n++){var p=pads[n];circle(bg,p[0]+2,p[1]+6,24,'#737956');circle(bg,p[0],p[1],22,'#b9b690');circle(bg,p[0],p[1],18,'#8b9776');bg.strokeStyle='#dee0b4';bg.lineWidth=1;bg.beginPath();bg.arc(p[0],p[1],18,0,Math.PI*2);bg.stroke();}rect(bg,161,442,87,28,'#344b3c');rect(bg,165,438,79,24,'#bec3a0');rect(bg,176,434,57,24,'#637e69');rect(bg,195,443,19,27,'#273f35');rect(bg,174,440,12,5,'#a0d6c0');rect(bg,219,440,10,5,'#a0d6c0');}
function onRoad(x,y,r){for(var j=1;j<path.length;j++){var a=path[j-1],b=path[j];if(x>=Math.min(a[0],b[0])-r&&x<=Math.max(a[0],b[0])+r&&y>=Math.min(a[1],b[1])-r&&y<=Math.max(a[1],b[1])+r)return true;}return false;}
function locate(d){for(var j=0;j<lengths.length;j++){if(d<=lengths[j]){var a=path[j],b=path[j+1],t=Math.max(0,d/lengths[j]);return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t};}d-=lengths[j];}return{x:205,y:466};}
function save(){try{localStorage.setItem('novaDefense1',JSON.stringify(saved));}catch(ignore){}}
function hideOverlay(){overlay.style.display='none';}

function home(){state='menu';show('<span class="eyebrow">NOVA DEFENSE / SECTOR 01</span><h1>NOVA<br>STRIKER</h1><p>สร้างแนวป้องกัน หยุดฝูงศัตรู<br>ปกป้องกองบัญชาการให้ครบ 20 เวฟ</p><div class="hero"><div class="road"></div><div class="bunker"></div><div class="hero-label">ป้อมปืน • ระเบิด • ไฟฟ้า<br><small>กองกำลังเดิม ภารกิจใหม่</small></div></div><button class="wide primary" onclick="startLevel('+saved.unlocked+')">▶ ป้องกันฐาน • ด่าน '+saved.unlocked+'</button><button class="wide" onclick="levelMenu()">เลือกภารกิจ / 50 ด่าน</button><div class="card"><b>แตะสร้าง → เริ่มเวฟ → อัปเกรด</b><p>ศัตรูเดินตามถนน ป้อมยิงอัตโนมัติ<br>เงินในสนามใช้สร้างป้อมและอัปเกรด<br>เล่นออฟไลน์ได้ • กราฟิกเบา • พักได้ทุกเวลา</p><span class="muted">เหรียญภารกิจสะสม '+saved.medals+' • ความคืบหน้าเกมยิงเดิมยังเก็บไว้</span></div><button class="wide" onclick="privacy()">ความเป็นส่วนตัว / โฆษณา</button>');updateUI();render();}
function levelMenu(){state='menu';var h='<h2>เลือกภารกิจ</h2><p>20 เวฟต่อด่าน • บอสทุกเวฟที่ 5<br>ด่านสูงขึ้น ศัตรูแข็งแกร่งขึ้น</p><div class="levels">';for(var i=1;i<=50;i++)h+='<button '+(i>saved.unlocked?'disabled':'')+' onclick="startLevel('+i+')">'+i+'<br><small>'+(saved.stars[i]?'★'.repeat(saved.stars[i]):(i>saved.unlocked?'—':'▶'))+'</small></button>';show(h+'</div><button class="wide" onclick="home()">กลับหน้าหลัก</button>');}
function startLevel(n){level=Math.max(1,Math.min(saved.unlocked,n));wave=0;hp=20;cash=220;kills=0;selected=-1;speed=1;spawnLeft=0;clock=0;enemyList=[];shots=[];effects=[];towers=pads.map(function(){return null;});state='ready';hideOverlay();updateUI();render();}
function nextWave(){if(state!=='ready')return;wave++;spawnLeft=6+Math.floor(wave*1.2);spawnClock=0;state='battle';selected=-1;updateUI();}
function toggleSpeed(){speed=speed===1?2:1;updateUI();}
function selectPad(i){if(state!=='battle'&&state!=='ready')return;selected=i;updateUI();render();}
function build(k){if(selected<0||towers[selected]||state!=='battle'&&state!=='ready')return;var a=kinds[k];if(!a||cash<a.cost)return;cash-=a.cost;towers[selected]={kind:k,lv:1,cool:0,spent:a.cost,angle:-Math.PI/2};updateUI();render();}
function upgradeCost(t){return Math.round(kinds[t.kind].cost*(.65+t.lv*.35));}
function upgrade(){var t=towers[selected];if(!t||t.lv>=5||state!=='battle'&&state!=='ready')return;var c=upgradeCost(t);if(cash<c)return;cash-=c;t.spent+=c;t.lv++;updateUI();render();}
function sell(){var t=towers[selected];if(!t||state!=='battle'&&state!=='ready')return;cash+=Math.floor(t.spent*.65);towers[selected]=null;updateUI();render();}
function updateUI(){document.getElementById('stats').textContent='ฐาน '+hp+'/20 • เงิน '+cash+'\nด่าน '+level+' • เวฟ '+wave+'/20';var b=document.getElementById('wave');b.disabled=state!=='ready';b.textContent=state==='battle'?'ศัตรูเหลือ '+(spawnLeft+enemyList.length):'▶ เริ่มเวฟ '+(wave+1);document.getElementById('speed').textContent='เร็ว ×'+speed;document.getElementById('hint').textContent=state==='battle'?'ป้อมยิงอัตโนมัติ • แตะป้อมเพื่ออัปเกรด':'สร้างป้อมก่อน แล้วกดเริ่มเวฟ • ฐานอยู่ด้านล่าง';var d=document.getElementById('detail'),a=document.getElementById('actions');if(selected<0){d.textContent='แตะจุดวงกลมบนสนามเพื่อสร้างป้อม';a.innerHTML='<button onclick="autoSelect()">＋ เลือกจุดสร้างป้อม<small>เริ่มต้น 75</small></button>';return;}var t=towers[selected];if(t){var k=kinds[t.kind],c=upgradeCost(t);d.textContent=k.name+' Lv.'+t.lv+' • '+k.label;a.innerHTML='<button class="primary" '+(cash<c||t.lv>=5?'disabled':'')+' onclick="upgrade()">'+(t.lv>=5?'สูงสุดแล้ว':'อัปเกรด '+c)+'</button><button onclick="sell()">ขายคืน '+Math.floor(t.spent*.65)+'</button>';}else{d.textContent='จุดสร้าง '+(selected+1)+' • เลือกป้อม';a.innerHTML=kinds.map(function(k,i){return '<button '+(cash<k.cost?'disabled':'')+' onclick="build('+i+')">'+k.name+'<small>'+k.cost+' • '+k.label.split(' • ')[0]+'</small></button>';}).join('');}}
function autoSelect(){for(var j=0;j<pads.length;j++)if(!towers[j]){selectPad(j);return;}}
function spawnEnemy(){var boss=wave%5===0&&spawnLeft===1,kind=boss?8:((wave+spawnLeft)%8);var life=(22+wave*8)*(1+(level-1)*.12)*(boss?8:1);enemyList.push({id:nextId++,d:0,x:20,y:-25,hp:life,max:life,kind:kind,boss:boss,slow:0,hit:0,speed:(boss?25:33+kind*2+Math.min(wave,20))*(1+Math.min(level-1,49)*.006)});spawnLeft--;}
function damage(e,d){if(e.hp<=0)return;e.hp-=d;e.hit=.12;if(e.hp<=0){cash+=e.boss?60:8;kills++;effects.push({x:e.x,y:e.y,t:.3,max:.3,color:'#eac96b',r:e.boss?35:18});}}
function update(dt){if(state!=='battle')return;clock+=dt;spawnClock-=dt;if(spawnLeft>0&&spawnClock<=0){spawnEnemy();spawnClock=.65;}for(var j=0;j<enemyList.length;j++){var e=enemyList[j];if(e.hp<=0)continue;e.slow=Math.max(0,e.slow-dt);e.hit=Math.max(0,e.hit-dt);e.d+=e.speed*dt*(e.slow>0?.5:1);var p=locate(e.d);e.x=p.x;e.y=p.y;if(e.d>=total){e.hp=0;hp=Math.max(0,hp-(e.boss?4:1));if(hp===0){end(false);return;}}}
for(var j=0;j<towers.length;j++){var t=towers[j];if(!t)continue;t.cool-=dt;if(t.cool>0)continue;var k=kinds[t.kind],p=pads[j],range=k.range+(t.lv-1)*7,targets=enemyList.filter(function(e){return e.hp>0&&(e.x-p[0])*(e.x-p[0])+(e.y-p[1])*(e.y-p[1])<=range*range;});targets.sort(function(a,b){return b.d-a.d;});if(!targets.length)continue;var target=targets[0],power=k.damage*(1+(t.lv-1)*.65);t.angle=Math.atan2(target.y-p[1],target.x-p[0]);t.cool=k.rate/(1+(t.lv-1)*.12);if(t.kind===2){targets.slice(0,3).forEach(function(e){damage(e,power);e.slow=1.6;shots.push({x:p[0],y:p[1]-8,tx:e.x,ty:e.y,t:.14,color:k.color,lightning:true});});}else{damage(target,power);shots.push({x:p[0],y:p[1]-8,tx:target.x,ty:target.y,t:.13,color:k.color});if(t.kind===1){enemyList.forEach(function(e){if(e!==target&&(e.x-target.x)*(e.x-target.x)+(e.y-target.y)*(e.y-target.y)<40*40)damage(e,power*.7);});effects.push({x:target.x,y:target.y,t:.25,max:.25,color:'#e9a64d',r:40});}}}
enemyList=enemyList.filter(function(e){return e.hp>0;});shots.forEach(function(s){s.t-=dt;});shots=shots.filter(function(s){return s.t>0;}).slice(-30);effects.forEach(function(s){s.t-=dt;});effects=effects.filter(function(s){return s.t>0;}).slice(-25);if(!spawnLeft&&!enemyList.length){cash+=25+wave*2;if(wave===maxWave){end(true);return;}state='ready';updateUI();}else if(Math.floor(clock*5)!==Math.floor((clock-dt)*5))updateUI();}

function drawEnemy(e){circle(g,e.x+2,e.y+6,e.boss?20:10,'#424e3c');var size=e.boss?57:30;if(atlasReady){var cell=e.boss?12+(Math.floor(wave/5)-1)%4:4+e.kind;g.drawImage(atlas,(cell%4)*256,Math.floor(cell/4)*256,256,256,e.x-size/2,e.y-size/2-4,size,size);}else{circle(g,e.x,e.y,e.boss?21:10,e.boss?'#876b87':['#b3a063','#7c9396','#a47f61','#9e849d'][e.kind%4]);rect(g,e.x-6,e.y-5,4,3,'#f9d779');rect(g,e.x+3,e.y-5,4,3,'#f9d779');}if(e.slow>0){g.strokeStyle='#8be7ef';g.lineWidth=2;g.beginPath();g.arc(e.x,e.y,14,0,6.29);g.stroke();}if(e.hp<e.max||e.boss){rect(g,e.x-14,e.y-size/2-8,28,3,'#384234');rect(g,e.x-14,e.y-size/2-8,28*e.hp/e.max,3,'#e6aa62');}}
function drawTower(t,p){var k=kinds[t.kind];circle(g,p[0]+2,p[1]+6,18,'#52654b');rect(g,p[0]-14,p[1]-10,28,24,'#314e42');rect(g,p[0]-13,p[1]-14,26,21,'#a6b391');rect(g,p[0]-9,p[1]-12,18,16,'#597763');circle(g,p[0],p[1]-5,10,'#365245');g.save();g.translate(p[0],p[1]-6);if(t.kind===2){rect(g,-4,-20,8,22,'#7998a0');circle(g,0,-20,6,'#b0f0ed');line(g,[[-7,-12],[7,-12]],'#d6e7d0',3);}else{g.rotate(t.angle);rect(g,0,-4,23,t.kind===1?9:6,'#293f38');rect(g,3,-4,17,3,'#c0ceb4');}g.restore();for(var n=0;n<t.lv;n++)rect(g,p[0]-10+n*5,p[1]+12,3,3,k.color);}
function render(){g.clearRect(0,0,W,H);g.drawImage(ground,0,0);if(selected>=0&&(state==='ready'||state==='battle')){var p=pads[selected],t=towers[selected],r=t?kinds[t.kind].range+(t.lv-1)*7:90;g.fillStyle='rgba(184,226,179,.13)';g.strokeStyle='#eff3b4';g.lineWidth=1;g.beginPath();g.arc(p[0],p[1],r,0,Math.PI*2);g.fill();g.stroke();}for(var j=0;j<pads.length;j++){if(towers[j])drawTower(towers[j],pads[j]);else{g.fillStyle='#eff1c4';g.font='20px sans-serif';g.textAlign='center';g.fillText('+',pads[j][0],pads[j][1]+7);}}enemyList.forEach(drawEnemy);shots.forEach(function(s){if(s.lightning)line(g,[[s.x,s.y],[(s.x+s.tx)/2+5,(s.y+s.ty)/2-5],[s.tx,s.ty]],s.color,2);else line(g,[[s.x,s.y],[s.tx,s.ty]],s.color,2);});effects.forEach(function(e){g.globalAlpha=e.t/e.max;g.strokeStyle=e.color;g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,Math.max(2,e.r*(1-e.t/e.max)),0,Math.PI*2);g.stroke();});g.globalAlpha=1;g.fillStyle='#f6ebc3';g.font='bold 10px sans-serif';g.textAlign='center';g.fillText('กองบัญชาการ',205,432);}
