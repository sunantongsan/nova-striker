🛡 <b id="army">0</b></span></div></header><section id="field"><canvas id="world" width="420" height="460" aria-label="แผนที่ฐานทัพ แตะอาคารหรือพื้นที่ว่าง ลากเพื่อเลื่อน"></canvas><div id="instruction"></div><div class="zoom"><button onclick="Game.zoom(.1)">+</button><button onclick="Game.zoom(-.1)">−</button><button onclick="Game.cancel()">×</button></div><div id="selection"></div><div id="moveControls" hidden><button id="moveConfirm" class="green" onclick="Game.confirmMove()" aria-label="ยืนยันวางอาคาร">✓</button><button id="moveCancel" onclick="Game.cancelMove()" aria-label="ยกเลิกย้ายอาคาร">✕</button><span id="moveStatus" role="status"></span></div></section><nav><div id="homebar"><button onclick="Game.build()"><span class="nav-art" style="background-position:0 0"></span>สร้าง</button><button onclick="Game.training()"><img class="nav-art" src="assets/garrison.webp" alt="">ฝึกทหาร</button><button onclick="Game.treasury()"><span>💎</span>เพชร</button><button class="green" onclick="Game.activities()"><span class="nav-art" style="background-position:33.333% 66.667%"></span>ภารกิจ</button><button id="settingsButton" onclick="Game.settings()" aria-label="ตั้งค่า"><span aria-hidden="true">⚙</span>ตั้งค่า</button></div><div id="raidbar"><div class="raidtop"><b id="clock">150 วินาที</b><span id="raidhint">เลือกทหาร → แตะขอบสีฟ้า</span><button onclick="Game.pause()">Ⅱ</button></div><div id="deploy"></div></div></nav><div id="modal"></div><div id="toast"></div><section id="baseNameGate" hidden role="dialog" aria-modal="true" aria-label="ตั้งชื่อฐาน"><div class="name-card"><img src="assets/garrison.webp" alt=""><div class="language-switch"><button type="button" lang="en" onclick="Game.setLanguage('en')">English</button><button type="button" lang="th" onclick="Game.setLanguage('th')">ไทย</button></div><h2>ฐานของคุณชื่ออะไร?</h2><p>ตั้งชื่อก่อนเริ่มบัญชาการ • รองรับทุกภาษา<br>ชื่อฐานต้องไม่ซ้ำกับผู้เล่นอื่น</p><form onsubmit="Game.claimBaseName(event)"><input id="baseNameInput" dir="auto" autocomplete="off" maxlength="80" placeholder="ชื่อฐานของคุณ" aria-label="ชื่อฐาน" required><button id="baseNameSubmit" class="green" type="submit">ยืนยันชื่อและเข้าเล่น</button></form><p id="baseNameStatus" role="status" aria-live="polite"></p><button id="baseNameRetry" onclick="Game.checkBaseName()">ตรวจสอบอีกครั้ง</button><button id="baseNameLogin" hidden onclick="Game.baseNameLogin()">เข้าสู่ระบบอีกครั้ง</button></div></section><section id="welcome" hidden aria-label="ยินดีต้อนรับสู่ Nova Striker"><h1 class="nova-logo">NOVA<span>STRIKER</span></h1><div class="welcome-panel"><div class="language-switch"><button type="button" lang="en" onclick="Game.setLanguage('en')">English</button><button type="button" lang="th" onclick="Game.setLanguage('th')">ไทย</button></div><h2 id="welcomeTitle">เริ่มภารกิจของคุณ</h2><p id="welcomeHint">สมัครเพื่อเข้าเล่น • ฐานเดิมในเครื่องยังอยู่</p><form onsubmit="Game.welcomeSubmit(event)"><label>อีเมล<input id="welcomeEmail" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></label><label id="welcomePasswordRow">รหัสผ่าน<input id="welcomePassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="อย่างน้อย 8 ตัวอักษร" required></label><button id="welcomeSubmit" class="green" type="submit">สร้างบัญชีและเริ่มเล่น</button></form><button id="welcomeGoogle" class="welcome-google" onclick="Game.welcomeGoogle()"><span class="google-g" aria-hidden="true">G</span>ดำเนินการต่อด้วย Google</button><p id="welcomeStatus" role="status" aria-live="polite"></p><div class="welcome-links"><button id="welcomeSwitch" class="text-button" onclick="Game.welcomeSwitch()">มีบัญชีแล้ว? เข้าสู่ระบบ</button><button class="text-button" onclick="Game.welcomeForm('recover')">ลืมรหัสผ่าน</button></div><a href="https://nova-striker-privacy.fit-rain-4305.chatgpt.site">นโยบายความเป็นส่วนตัว</a></div></section><div id="boot"><img src="assets/garrison.webp" alt="ฐานทัพ NOVA" style="width:160px;max-width:60%;height:160px;object-fit:contain"><h2>NOVA STRIKER</h2><p id="bootmessage">กำลังเตรียมฐานทัพ…</p><button onclick="location.reload()">ลองเปิดใหม่</button></div></main><script>window.addEventListener('error',function(e){if(e.target===window){window.novaPatchError=true;document.getElementById('boot').style.display='block';document.getElementById('bootmessage').textContent=window.NovaI18n?window.NovaI18n.translate('เปิดเกมไม่สำเร็จ กดลองเปิดใหม่'):'Could not start the game. Please reopen it';}});</script><script src="game.js"></script><script>window.novaPatchReady=!!window.Game;</script></body></html>
